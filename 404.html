<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Coming soon | Kapoor Jewellers</title>
  <meta name="robots" content="noindex">
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
    // Pages that are not built yet: send visitors to the coming-soon page, keeping the
    // requested path in ?from= (skip when the coming-soon page itself is missing).
    // local / aemcoder preview serves pages under /content
    const base = window.location.pathname.startsWith('/content/') ? '/content' : '';
    if (!window.location.pathname.startsWith(`${base}/coming-soon`)) {
      const from = `${window.location.pathname.slice(base.length)}${window.location.search}`;
      window.location.replace(`${base}/coming-soon?from=${encodeURIComponent(from)}`);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Coming soon | Kapoor Jewellers">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      text-align: center;
    }

    main.error .section {
      width: 100%;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <h1>Coming soon</h1>
      <p>This page of the Kapoor Jewellers site is being prepared. In the meantime, explore our latest collections on the homepage.</p>
      <p class="button-wrapper">
        <a href="/" class="button primary">Back to homepage</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
